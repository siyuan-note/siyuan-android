plugins {
    id 'com.android.application'
    id 'base' // 显式引入 base 插件以确保 base 闭包可用
}

// 多渠道打包配置
apply from: rootProject.file('flavors.gradle')
apply from: rootProject.file('signings.gradle')
apply from: rootProject.file('buildRelease.gradle')

// 1. 配置 App Bundle (.aab) 的基础文件名
base {
    archivesName = "siyuan-${rootProject.siyuanVersionName}"
}

tasks.withType(Copy).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

android {
    namespace = 'org.b3log.siyuan'
    compileSdk = 36
    // 纯 Java 模块无需创建 Kotlin 编译任务或引入 Kotlin 标准库。
    enableKotlin = false

    defaultConfig {
        applicationId = "org.b3log.siyuan"
        minSdk = 26
        targetSdk = 36
        versionCode = rootProject.siyuanVersionCode
        versionName = rootProject.siyuanVersionName
    }

    buildFeatures {
        buildConfig = true
        resValues = true
    }

    buildTypes {
        release {
            // 正式版打包时指定签名证书
            signingConfig = signingConfigs.siyuanConfig

            minifyEnabled = true
            shrinkResources = true

            // 此处优先级太高，渠道处配置 resValue 不会生效，故放到了 productFlavors 多渠道打包处处理
            // resValue "string", "app_name", "SiYuan"
            resValue "string", "app_package_name", "org.b3log.siyuan"

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix = ".debug"

            minifyEnabled = false

            resValue "string", "app_name", "SiYuan-Debug"
            resValue "string", "app_package_name", "org.b3log.siyuan.debug"

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES',
                         'META-INF/LICENSE',
                         'META-INF/LICENSE.txt',
                         'META-INF/license.txt',
                         'META-INF/NOTICE',
                         'META-INF/NOTICE.txt',
                         'META-INF/notice.txt',
                         'plugin.properties']
        }
        jniLibs {
            useLegacyPackaging = true
        }
    }

    lint {
        abortOnError = false
    }

}

// 通过公开的变体接口设置 APK 名称，保留渠道、构建类型和调试时间戳。
androidComponents {
    onVariants(selector().all()) { variant ->
        def buildType = variant.buildType
        def flavorName = variant.flavorName
        def suffix = buildType == "release" ? "" : "-${new Date().format('yyyyMMddHHmmss')}"
        variant.outputs.each { output ->
            output.outputFileName.set(output.versionName.map { version ->
                "siyuan-${version}-${flavorName}-${buildType}${suffix}.apk"
            })
        }
    }
}

dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.24.3'
    implementation 'androidx.activity:activity:1.12.4'
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.lifecycle:lifecycle-process:2.6.2'
    implementation 'androidx.work:work-runtime:2.11.1'
    implementation 'androidx.browser:browser:1.7.0'
    implementation 'commons-io:commons-io:2.21.0'
    implementation 'com.blankj:utilcodex:1.31.1'
    implementation 'com.koushikdutta.async:androidasync:3.1.0'
    implementation files('libs/kernel.aar')
}
